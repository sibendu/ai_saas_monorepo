apiVersion: v1
kind: Service
metadata:
  name: saas-web-service
  namespace: saas-foundation
  labels:
    app.kubernetes.io/name: saas-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: saas-foundation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: saas-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
