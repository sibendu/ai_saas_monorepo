apiVersion: v1
kind: Service
metadata:
  name: saas-postgres-service
  namespace: saas-foundation
  labels:
    app.kubernetes.io/name: saas-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: saas-foundation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: saas-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
