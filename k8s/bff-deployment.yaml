apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-bff
  namespace: saas-foundation
  labels:
    app.kubernetes.io/name: saas-bff
    app.kubernetes.io/component: bff
    app.kubernetes.io/part-of: saas-foundation
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-bff
      app.kubernetes.io/component: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-bff
        app.kubernetes.io/component: bff
        app.kubernetes.io/part-of: saas-foundation
    spec:
      containers:
        - name: bff
          image: ghcr.io/example/saas-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: PORT
            - name: WEB_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: WEB_APP_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
