apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-web
  namespace: saas-foundation
  labels:
    app.kubernetes.io/name: saas-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: saas-foundation
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: saas-foundation
    spec:
      containers:
        - name: web
          image: ghcr.io/example/saas-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: NODE_ENV
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: NEXTAUTH_URL
            - name: BFF_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: BFF_INTERNAL_URL
            - name: MENU_LAYOUT
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: MENU_LAYOUT
            - name: THEME
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: THEME
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: NEXTAUTH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: DATABASE_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: GITHUB_ID
            - name: GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: GITHUB_SECRET
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: GMAIL_APP_PASSWORD
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
